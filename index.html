.r{background:var(--box);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}

summary{display:grid;grid-template-columns:9px 1fr auto auto;gap:4px 12px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}

function pl(n,y){n.s=sp(n);n.cy=y+n.s/2;const t=n.k.reduce((s,c)=>s+sp(c),0);let c=y+(n.s-t)/2;n.k.forEach(k=>{pl(k,c);c+=sp(k)})}
function graph(){const L=data();tree(L);
 w.innerHTML='<svg id="e"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ln)"/></marker></defs></svg>';
 all=[];(function g(n){all.push(n);n.k.forEach(g)})(root);
 all.forEach((n,i)=>{const d=document.createElement('div');d.className='n L'+n.l;d.style.width=W[n.l]+'px';d.innerHTML=n.h;d.dataset.i=i;w.append(d);n.d=d;n.hh=d.offsetHeight});
 pl(root,0);const e=$('#e');e.setAttribute('width',X[4]+W[4]);e.setAttribute('height',root.s);
 all.forEach(n=>{n.d.style.left=X[n.l]+'px';n.d.style.top=n.cy-n.hh/2+'px';n.k.forEach(c=>{const x1=X[n.l]+W[n.l],x2=X[c.l],p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',`M${x1} ${n.cy}C${x1+HG/2} ${n.cy} ${x2-HG/2} ${c.cy} ${x2-2} ${c.cy}`);p.setAttribute('marker-end','url(#a)');e.append(p)})});ap()}
const ap=()=>w.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.k})`;
function zoom(m,px=cv.clientWidth/2,py=cv.clientHeight/2){const k=Math.min(1.6,Math.max(.2,st.k*m));st.x=px-(px-st.x)*k/st.k;st.y=py-(py-st.y)*k/st.k;st.k=k;ap()}
let dr=null,mv=0;
cv.addEventListener('pointerdown',e=>{if(e.target.closest('a,button'))return;dr={x:e.clientX-st.x,y:e.clientY-st.y,a:e.clientX,b:e.clientY};mv=0});
addEventListener('pointermove',e=>{if(!dr)return;st.x=e.clientX-dr.x;st.y=e.clientY-dr.y;mv=Math.hypot(e.clientX-dr.a,e.clientY-dr.b);ap()});
addEventListener('pointerup',()=>dr=null);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
w.addEventListener('click',e=>{if(mv>5||e.target.closest('a'))return;const el=e.target.closest('.L1');if(!el)return;const n=all[el.dataset.i];open.has(n.b)?open.delete(n.b):open.add(n.b);graph()});
$('#b1').onclick=()=>{open.clear();graph();st.x=20;st.y=20;ap()};
$('#b2').onclick=()=>{D.forEach(b=>open.add(b[0]));graph();st.x=20;st.y=20;st.k=.6;ap()};
$('#bp').onclick=()=>zoom(1.2);$('#bm').onclick=()=>zoom(.83);
function go(){document.body.className=f.v;document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v==f.v));
 document.querySelectorAll('#ks button').forEach(b=>b.classList.toggle('on',b.dataset.k==f.k));list();graph()}
$('#q').oninput=e=>{f.q=e.target.value.trim().toLowerCase();go()};
$('#so').onchange=e=>{f.s=e.target.value;go()};
$('#ks').onclick=e=>{if(e.target.dataset.k!=null){f.k=e.target.dataset.k;go()}};
$('#vw').onclick=e=>{if(e.target.dataset.v){f.v=e.target.dataset.v;go()}};
$('#bk').onchange=e=>{const i=e.target.value;if(i==='')return;const n=data()[i].n;
 if(f.v=='l'){document.getElementById('s'+i).scrollIntoView({behavior:'smooth'})}else{open.add(n);graph();const b=all.find(x=>x.l==1&&x.b==n);st.k=.9;st.x=20-X[1]*.9;st.y=cv.clientHeight/2-b.cy*.9;ap()}e.target.value=''};
$('#bt').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='light'?'dark':'light'};
go();
</script>
</body>
